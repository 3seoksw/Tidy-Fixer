# Generates TidyFixer.xcodeproj. Run `xcodegen` after adding or removing a source file.
# The SwiftPM build (scripts/bundle.sh) uses the same sources and Resources/Info.plist.
name: TidyFixer
options:
  bundleIdPrefix: com.wskim
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  TidyFixer:
    type: application
    platform: macOS
    sources:
      - path: Sources/TidyFixer
      - path: Resources
        excludes: [Info.plist]
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wskim.local-writing-fixer
        PRODUCT_NAME: TidyFixer
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # "-" signs ad hoc, like scripts/bundle.sh, so no developer account is needed.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        # Keep the menu-bar PNGs as plain files, like the SwiftPM build, so the app can load them by name.
        COMBINE_HIDPI_IMAGES: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  TidyFixerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TidyFixerTests
    dependencies:
      - target: TidyFixer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wskim.local-writing-fixer.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TidyFixer.app/Contents/MacOS/TidyFixer"
schemes:
  TidyFixer:
    build:
      targets:
        TidyFixer: all
    run:
      config: Debug
    test:
      targets: [TidyFixerTests]
  # Same app, but hides all system log output. Use it only for a quiet console, because it also
  # hides useful warnings such as layout problems.
  TidyFixerQuiet:
    build:
      targets:
        TidyFixer: all
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: disable
